# Dev-only values. Real deployments should create this Secret out of band (or from a secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: payledger-secrets
  labels:
    payledger/dev-only: "true"
type: Opaque
stringData:
  POSTGRES_PASSWORD: payledger
  JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
