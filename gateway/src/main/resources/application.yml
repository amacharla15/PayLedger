spring:
  application:
    name: gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: payledger
    password: payledger
  sql:
    init:
      mode: always
      schema-locations: classpath:auth-schema.sql
  data:
    redis:
      host: localhost
      port: 6379
      # Short timeouts so a Redis outage fails fast instead of hanging requests.
      timeout: 500ms
      connect-timeout: 500ms
  graphql:
    graphiql:
      enabled: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

ledger:
  target: ${LEDGER_TARGET:localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
