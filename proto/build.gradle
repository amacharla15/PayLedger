plugins {
    id 'java-library'
    id 'com.google.protobuf'
}

dependencies {
    api 'io.grpc:grpc-protobuf'
    api 'io.grpc:grpc-stub'
}

// Keep protoc and the gRPC plugin on the same versions the Spring Boot BOM manages.
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.36.2'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.84.1'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}
