spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: payledger
    password: payledger
  sql:
    init:
      mode: always

server:
  port: 8081

grpc:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
